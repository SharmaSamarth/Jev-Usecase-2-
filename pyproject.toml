[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-classifier"
version = "0.1.0"
description = "Email triage classification POC with a provider-agnostic evaluation framework (Claude Sonnet vs. Jev)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.13,<2",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Jev (TypeSafe AI) official SDK. Install only where Jev may run: pip install -e ".[jev]"
jev = ["typesafe-sdk>=0.7.4,<0.8"]

[project.scripts]
email-classifier = "email_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
